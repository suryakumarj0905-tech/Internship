<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            width: 350px;
            margin: 50px auto;
            border: 1px solid black;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        button {
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>

    <div class="container">

        <h2>Job Application Form</h2>

        <form>

            <label>Full Name:</label><br>
            <input type="text" name="fullname" value="Suryakumar J"><br><br>

            <label>Email:</label><br>
            <input type="email" name="email" value="suryakumarj0905@gmail.com"><br><br>

            <label>Phone Number:</label><br>
            <input type="tel" name="phone" value="6385653144"><br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other
            <br><br>

            <label>Skills:</label><br>
            <input type="checkbox" name="skills" value="HTML"> HTML<br>
            <input type="checkbox" name="skills" value="CSS"> CSS<br>
            <input type="checkbox" name="skills" value="Java"> Java<br>
            <input type="checkbox" name="skills" value="Python"> Python
            <br><br>

            <label>Resume Upload:</label><br>
            <input type="file"><br><br>

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
