<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block vs Inline Elements</title>
</head>
<body>
    <h2>Block Elements (div)</h2>
    <div style="border: 1px solid black; padding: 10px;">
        <p>This is a 1st block-level element.</p>
    </div>
    <div style="border: 1px solid black; padding: 10px;">
        <p>This is a 2nd block-level element.</p>
    </div>
    <div style="border: 1px solid black; padding: 10px;">
        <p>This is a 3rd block-level element.</p>
    </div>
    <h2>Inline Elements (span)</h2>
    <span style="border: 1px solid red; padding: 5px;">
        span 1
    </span>
    <span style="border: 1px solid red; padding: 5px;">
        span 2
    </span>
    <span style="border: 1px solid red; padding: 5px;">
        span 3
    </span>

</body>
</html>
